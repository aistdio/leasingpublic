services:
  db:
    image: postgres:18-alpine
    container_name: autoleasing-db
    environment:
      POSTGRES_DB: autoleasing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d autoleasing || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms128M -Xmx512M"
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:4.1.0
    container_name: broker1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,BROKER://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:29092,PLAINTEXT_HOST://broker1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: AkU3OEVBNTcwATJENDM2Qa
    healthcheck:
      test: [ "CMD-SHELL", "nc -z broker1 9092 || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-metadata:/var/lib/kafka/metadata


  app:
    build:
      context: .
      dockerfile: dockerfile
    image: autoleasing:latest
    pull_policy: never
    container_name: autoleasing-app
    depends_on:
      - kafka
      - db
    ports:
      - "8443:8443"
      - "8000:8000"
    restart: unless-stopped

volumes:
  kafka-data:
  kafka-metadata:
  pgdata: